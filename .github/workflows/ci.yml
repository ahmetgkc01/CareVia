name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: carevia_ci
          POSTGRES_USER: carevia_ci
          POSTGRES_PASSWORD: carevia_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carevia_ci -d carevia_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-that-is-longer-than-fifty-characters-123456789
      POSTGRES_DB: carevia_ci
      POSTGRES_USER: carevia_ci
      POSTGRES_PASSWORD: carevia_ci
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - run: python -m pip install -r backend/requirements/dev.txt
      - run: python -m ruff check backend
      - run: python -m pip_audit -r backend/requirements/prod.txt
      - run: python manage.py migrate --noinput
        working-directory: backend
      - run: python manage.py makemigrations --check --dry-run
        working-directory: backend
      - run: python -m pytest
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
      - run: npm run test:run
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: carevia_e2e
          POSTGRES_USER: carevia_e2e
          POSTGRES_PASSWORD: carevia_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carevia_e2e -d carevia_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CAREVIA_E2E_PASSWORD: carevia-e2e-password
      POSTGRES_DB: carevia_e2e
      POSTGRES_USER: carevia_e2e
      POSTGRES_PASSWORD: carevia_e2e
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements/dev.txt
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: python manage.py migrate --noinput
        working-directory: backend
      - run: python manage.py seed_e2e --password "$CAREVIA_E2E_PASSWORD"
        working-directory: backend
      - run: npm run test:e2e
        working-directory: frontend
