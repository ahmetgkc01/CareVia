services:
  backend:
    build:
      context: ../backend
    env_file:
      - ${CAREVIA_ENV_FILE:-.env.production}
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; request=urllib.request.Request('http://127.0.0.1:8000/api/health/', headers={'Host':'carevia.18-156-187-209.sslip.io','X-Forwarded-Proto':'https'}); urllib.request.urlopen(request, timeout=3).read()"
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - private

  frontend:
    build:
      context: ../frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      private:
      benchmind:
        aliases:
          - carevia-frontend

networks:
  private:
  benchmind:
    external: true
    name: benchmind_default
