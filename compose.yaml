services:
  database:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-carevia}
      POSTGRES_USER: ${POSTGRES_USER:-carevia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carevia}
    ports:
      # Keep PostgreSQL private. pgAdmin can connect locally or through an SSH tunnel.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-carevia} -d ${POSTGRES_DB:-carevia}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

